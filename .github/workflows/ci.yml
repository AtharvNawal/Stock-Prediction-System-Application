# Continuous Integration: every push and pull request must pass lint, security scans,
# Django's deployment checks and the test suite, and the Docker image must build.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu  # CPU-only torch: ~200 MB instead of ~2 GB

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.11.0
      - run: ruff check --output-format=github .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Bandit (static analysis, medium severity and up)
        run: bandit -c pyproject.toml -r app core scripts -ll
      - name: pip-audit (known CVEs in pinned dependencies)
        run: pip-audit -r requirements.txt --progress-spinner off

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Production settings (DEBUG off), with HTTPS redirect off because the test client speaks plain HTTP
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_SECURE_SSL_REDIRECT: '0'
      SQLITE_PATH: /tmp/ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
      - name: Django deployment checklist
        env:
          DJANGO_SECURE_SSL_REDIRECT: '1'
          DJANGO_ALLOWED_HOSTS: investiq.example.com
          DJANGO_SECRET_KEY: ${{ github.run_id }}-ci-deploy-check-key-that-is-long-and-random-enough-for-django
        run: python manage.py check --deploy --fail-level WARNING
      - name: Run tests with coverage
        run: |
          coverage run manage.py test app -v 2
          coverage report
          coverage xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed; CD publishes it from main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: investiq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
