# Continuous Delivery: once CI has passed on main, publish the Docker image to GitHub
# Container Registry, then trigger the deployment.
#
# Setup (once, in the GitHub repository settings):
#   Settings -> Environments -> "production": optionally add required reviewers (manual approval gate)
#   Settings -> Secrets -> Actions: DEPLOY_HOOK_URL = your host's deploy hook, e.g. Render's
#     "Deploy Hook" or Railway's webhook. Without it the image is still published, deploy is skipped.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false  # never interrupt a deployment halfway

permissions:
  contents: read

jobs:
  publish:
    name: Publish image
    # only for successful CI runs on a push to main (not for pull requests from forks)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}  # the exact commit CI tested
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::notice::DEPLOY_HOOK_URL is not set; image published, deployment skipped."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "Deployment triggered."
