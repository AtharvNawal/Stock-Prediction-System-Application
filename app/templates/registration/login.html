{% extends 'base.html' %}

{% block content %}
            <div class="container-fluid px-4 auth-page">
                <div class="auth-card">
                    <h3 class="mb-1">Welcome back</h3>
                    <p class="mb-4">Log in to your InvestIQ account.</p>
                    <form method="post" action="{% url 'login' %}" novalidate>
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">
                        {% include 'registration/auth_form.html' %}
                        <button type="submit" class="btn btn-primary w-100 py-2">Log in</button>
                    </form>
                    <p class="mt-4 mb-0 text-center">New here? <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Get a free account</a></p>
                </div>
            </div>
{% endblock %}
