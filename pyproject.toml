[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["app/migrations", "virtualenv", "staticfiles"]

[tool.ruff.lint]
# pyflakes (unused/undefined names), syntax errors, and bugbear's likely-bug checks
select = ["F", "E9", "B"]
ignore = ["B008", "B905"]  # zip() over columns of one DataFrame is always equal length

[tool.coverage.run]
source = ["app", "core"]
omit = ["app/migrations/*", "*/tests/*", "core/asgi.py", "core/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["app/tests", "virtualenv", ".venv"]
